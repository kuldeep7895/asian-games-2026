name: Auto Update Asian Games Schedule & Results

on:
  schedule:
    # Run every 5 minutes (maximum allowed frequency on GitHub Actions)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Latest Schedule & Results from Official API
        run: |
          python3 build_full_database.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add asian_games_data.json asian_games_data.js
          if git diff --staged --quiet; then
            echo "No schedule updates detected."
          else
            git commit -m "⚡ Sync latest Asian Games 2026 schedule & results [skip ci]"
            git push
          fi
